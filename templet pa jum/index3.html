    <style>
      /* Reset & Layar Utama */
      body.sky-theme {
        background-color: #f3f7fa;
        font-family: 'Quicksand', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 20px;
      }

      /* Container Luar Biru Pastel Sky */
      .sky-card-outer {
        background-color: #8ccded;
        width: 100%;
        max-width: 360px;
        border-radius: 28px;
        padding: 24px 20px 18px 20px;
        position: relative;
        box-shadow: 0 12px 30px rgba(140, 205, 237, 0.4);
        box-sizing: border-box;
      }

      /* Header Kaomoji & Ikon */
      .sky-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #2b556d;
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 25px;
      }

      /* Kelinci & Awan Atas Kiri */
      .decor-bunny-cloud {
        position: absolute;
        top: 38px;
        left: 18px;
        color: #2b556d;
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.2;
        z-index: 2;
      }

      .decor-cloud-white {
        position: absolute;
        top: 32px;
        left: 55px;
        color: #ffffff;
        font-size: 2.5rem;
        z-index: 2;
      }

      /* Kartu Putih Dalam */
      .sky-card-inner {
        background: #e8f5fb;
        background: linear-gradient(180deg, #edf7fc 0%, #dcf0f9 100%);
        border-radius: 24px;
        padding: 30px 20px 25px 20px;
        box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8);
      }

      .sky-title {
        color: #222222;
        font-weight: 800;
        font-size: 1.6rem;
        text-align: center;
        margin-bottom: 4px;
      }

      .sky-subtitle {
        color: #6b8290;
        font-size: 0.88rem;
        text-align: center;
        font-weight: 600;
        margin-bottom: 26px;
      }

      /* Custom Input Fields Membulat (Pill) */
      .custom-input-group {
        background-color: #ffffff;
        border-radius: 50px;
        padding: 4px 16px;
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        border: 1px solid #e1eff6;
      }

      .custom-input-group i {
        color: #b0c4de;
        font-size: 1.1rem;
      }

      .custom-input-group input {
        border: none;
        outline: none;
        background: transparent;
        width: 100%;
        padding: 8px 10px;
        font-size: 0.9rem;
        color: #495057;
        font-family: 'Quicksand', sans-serif;
      }

      .custom-input-group input::placeholder {
        color: #bccee0;
        font-weight: 500;
      }

      .kaomoji-eye {
        color: #b0c4de;
        font-size: 0.9rem;
        font-weight: bold;
      }

      .toggle-eye {
        cursor: pointer;
        color: #b0c4de;
        transition: color 0.2s;
      }

      .toggle-eye:hover {
        color: #5b9bd5;
      }

      /* Tombol Sign In Biru Soft */
      .btn-sky-pill {
        background-color: #b3e5fc;
        color: #2c5873;
        font-weight: 700;
        font-size: 0.95rem;
        border: none;
        border-radius: 50px;
        padding: 10px;
        width: 100%;
        margin-top: 8px;
        margin-bottom: 22px;
        box-shadow: 0 4px 12px rgba(179, 229, 252, 0.5);
        transition: all 0.2s ease;
      }

      .btn-sky-pill:hover {
        background-color: #9fe0ff;
        color: #1a3c50;
        transform: translateY(-1px);
      }

      /* Footer Links & Kaomoji */
      .sky-footer-links {
        text-align: center;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .sky-footer-links a {
        color: #4b8cae;
        text-decoration: none;
        display: block;
        margin-bottom: 6px;
      }

      .sky-footer-links a:hover {
        color: #2b556d;
      }

      /* Kucing Bottom Right */
      .decor-cat-bottom {
        text-align: right;
        color: #2b556d;
        font-size: 0.85rem;
        font-weight: 700;
        margin-top: 15px;
      }
    </style>
  </head>

  <body class="sky-theme">

    <!-- Container Luar Warna Sky Blue -->
    <div class="sky-card-outer">
      
      <!-- Decor Top Left: Awan & Kelinci -->
      <div class="decor-bunny-cloud">
        (\_/)<br>
        ( 'x' )
      </div>
      <div class="decor-cloud-white">
        <i class="bi bi-cloud-fill"></i>
      </div>

      <!-- Header Top Bar -->
      <div class="sky-header">
        <i class="bi bi-cloud-line fs-5"></i>
        <span>(｡♥‿♥｡)</span>
        <i class="bi bi-gear fs-5"></i>
      </div>

      <!-- Kartu Putih Inner -->
      <div class="sky-card-inner">
        <div class="sky-title">Welcome Back!</div>
        <div class="sky-subtitle">Let's get you floating.</div>

        <form action="#" method="post">
          @csrf
          
          <!-- Input Email -->
          <div class="custom-input-group">
            <i class="bi bi-cloud-line"></i>
            <input type="email" name="email" placeholder="you@sky.com" required />
            <span class="kaomoji-eye">◕_◕</span>
          </div>

          <!-- Input Password -->
          <div class="custom-input-group">
            <i class="bi bi-lock"></i>
            <input id="passwordInput" type="password" name="password" placeholder="••••••••" required />
            <i id="togglePasswordIcon" class="bi bi-eye toggle-eye" title="Intip Password"></i>
          </div>

          <!-- Tombol Sign In -->
          <button type="submit" class="btn btn-sky-pill">Sign In</button>
        </form>

        <!-- Link Bawah -->
        <div class="sky-footer-links">

        </div>
      </div>

      <!-- Decor Bottom Right: Kucing -->
      <div class="decor-cat-bottom">
        (≈ㅇ ⋏ ㅇ≈)
      </div>

    </div>

    <!-- JavaScript Toggle Password -->
    <script>
      const passwordInput = document.getElementById('passwordInput');
      const togglePasswordIcon = document.getElementById('togglePasswordIcon');

      togglePasswordIcon.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

        if (isPassword) {
          this.classList.replace('bi-eye', 'bi-eye-fill');
          this.style.color = '#4b8cae';
        } else {
          this.classList.replace('bi-eye-fill', 'bi-eye');
          this.style.color = '#b0c4de';
        }
      });
    </script>
  </body>
